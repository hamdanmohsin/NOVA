<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA 3.0 | Clothing Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #111;
      color: white;
      padding: 16px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .cart-btn {
      border: none;
      background: white;
      color: #111;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      min-height: 70vh;
      display: flex;
      align-items: center;
      padding: 70px 7%;
      color: white;
      background:
        linear-gradient(rgba(0,0,0,.58), rgba(0,0,0,.58)),
        url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1800&q=85")
        center/cover;
    }

    .hero-content {
      max-width: 650px;
    }

    .hero h1 {
      font-size: clamp(48px, 8vw, 82px);
      line-height: 1;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .shop-btn {
      display: inline-block;
      background: white;
      color: #111;
      padding: 14px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      padding: 65px 7%;
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
    }

    .title h2 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .title p {
      color: #666;
    }

    .search {
      max-width: 650px;
      margin: 0 auto 35px;
    }

    .search input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 24px;
    }

    .product {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      transition: .2s;
    }

    .product:hover {
      transform: translateY(-4px);
    }

    .product-image {
      height: 230px;
      border-radius: 10px;
      background:
        linear-gradient(135deg, #eeeeee, #d7d7d7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-block;
      background: #111;
      color: white;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .product h3 {
      font-size: 18px;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .category {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .rating {
      color: #666;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .size {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      margin-bottom: 9px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .buttons button,
    .buttons a {
      flex: 1;
      padding: 11px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
    }

    .add {
      background: #111;
      color: white;
    }

    .view {
      background: #e9e9e9;
      color: #111;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 15px;
      padding: 25px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 18px;
      top: 12px;
      border: none;
      background: none;
      font-size: 28px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .cart-controls button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 5px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    .remove {
      background: #c00 !important;
    }

    .total {
      text-align: right;
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }
