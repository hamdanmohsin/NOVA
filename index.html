<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA — Modern Clothing Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --card: #111111;
      --card2: #161616;
      --text: #ffffff;
      --muted: #a0a0a0;
      --line: #292929;
      --accent: #ffffff;
      --danger: #ff5c5c;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    body.no-scroll {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      width: 100%;
      display: block;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    /* NAVBAR */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(8, 8, 8, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .logo span {
      color: #777;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .nav-links a {
      color: #aaa;
      font-size: 14px;
      transition: 0.2s;
    }

    .nav-links a:hover {
      color: white;
    }

    .cart-btn {
      border: 1px solid #444;
      background: white;
      color: black;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: 800;
    }

    /* HERO */

    .hero {
      min-height: 650px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 20%, #292929 0, transparent 30%),
        radial-gradient(circle at 20% 80%, #1a1a1a 0, transparent 30%);
    }

    .hero-content {
      padding: 90px 0;
      max-width: 720px;
    }

    .hero-tag {
      display: inline-block;
      border: 1px solid #444;
      padding: 7px 13px;
      border-radius: 999px;
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(52px, 9vw, 100px);
      line-height: 0.95;
      letter-spacing: -5px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: #777;
    }

    .hero p {
      max-width: 650px;
      color: #aaa;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .primary-btn,
    .secondary-btn {
      border-radius: 9px;
      padding: 13px 20px;
      font-weight: 800;
      transition: 0.2s;
    }

    .primary-btn {
      background: white;
      color: black;
      border: 1px solid white;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
    }

    .secondary-btn {
      background: transparent;
      color: white;
      border: 1px solid #444;
    }

    .secondary-btn:hover {
      background: #171717;
    }

    /* SECTIONS */

    section {
      padding: 90px 0;
      border-top: 1px solid #171717;
    }

    .section-heading {
      margin-bottom: 35px;
    }

    .eyebrow {
      color: #777;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .section-heading h2 {
      font-size: clamp(32px, 5vw, 50px);
      margin-bottom: 10px;
    }

    .section-heading p {
      color: #999;
      max-width: 650px;
    }

    /* FEATURES */

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .feature {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 25px;
    }

    .feature-icon {
      font-size: 27px;
      margin-bottom: 12px;
    }

    .feature h3 {
      margin-bottom: 6px;
    }

    .feature p {
      color: #999;
      font-size: 14px;
    }

    /* SHOP TOOLBAR */

    .shop-toolbar {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 230px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 9px;
      border: 1px solid #333;
      background: #101010;
      color: white;
      outline: none;
    }

    .search-box input:focus {
      border-color: #777;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-btn {
      padding: 10px 14px;
      border: 1px solid #333;
      background: #111;
      color: #aaa;
      border-radius: 8px;
      transition: 0.2s;
    }

    .category-btn:hover,
    .category-btn.active {
      background: white;
      color: black;
      border-color: white;
    }

    /* PRODUCTS */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      transition: 0.25s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: #444;
    }

    .product-image {
      aspect-ratio: 4 / 4.5;
      overflow: hidden;
      background: #1a1a1a;
    }

    .product-image img {
      height: 100%;
      object-fit: cover;
      transition: 0.35s;
    }

    .product-card:hover .product-image img {
      transform: scale(1.04);
    }

    .product-info {
      padding: 17px;
    }

    .product-category {
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .product-info h3 {
      margin: 5px 0;
      font-size: 18px;
    }

    .product-description {
      color: #888;
      font-size: 13px;
      min-height: 40px;
      margin-bottom: 10px;
    }

    .product-price {
      font-weight: 900;
      font-size: 18px;
      margin-bottom: 14px;
    }

    .product-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .product-actions button {
      padding: 11px;
      border-radius: 8px;
      font-weight: 800;
    }

    .order-now {
      background: white;
      color: black;
      border: 1px solid white;
    }

    .add-cart {
      background: transparent;
      color: white;
      border: 1px solid #444;
    }

    .add-cart:hover {
      background: #202020;
    }

    .no-products {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      border: 1px dashed #333;
      border-radius: 12px;
      color: #888;
    }

    /* ABOUT */

    .about-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: center;
    }

    .about-text p {
      color: #aaa;
      margin-bottom: 15px;
    }

    .about-card {
      background: linear-gradient(145deg, #161616, #0e0e0e);
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 30px;
    }

    .about-card h3 {
      margin-bottom: 15px;
    }

    .about-list {
      list-style: none;
    }

    .about-list li {
      padding: 11px 0;
      border-bottom: 1px solid #252525;
      color: #aaa;
    }

    .about-list li:last-child {
      border-bottom: none;
    }

    /* CONTACT */

    .contact-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 35px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .contact-box p {
      color: #999;
      margin: 10px 0 20px;
    }

    .contact-item {
      margin-bottom: 15px;
    }

    .contact-item span {
      display: block;
      color: #666;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 3px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid #222;
      padding: 35px 0;
      color: #777;
      font-size: 13px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* MODALS */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: min(600px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 25px;
      position: relative;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 25px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #444;
      background: #181818;
      color: white;
      font-size: 20px;
    }

    /* CART */

    .cart-item {
      display: grid;
      grid-template-columns: 75px 1fr auto;
      gap: 13px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #282828;
    }

    .cart-item img {
      width: 75px;
      height: 85px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-item h4 {
      margin-bottom: 3px;
    }

    .cart-meta {
      color: #888;
      font-size: 12px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .qty-controls button {
      width: 27px;
      height: 27px;
      border: 1px solid #444;
      background: #191919;
      color: white;
      border-radius: 5px;
    }

    .remove-btn {
      border: none;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
      margin-top: 5px;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 900;
      padding: 20px 0;
    }

    .empty-cart {
      text-align: center;
      color: #888;
      padding: 45px 10px;
    }

    /* FORM */

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 13px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0b0b0b;
      color: white;
      outline: none;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #777;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .form-buttons button {
      flex: 1;
    }

    /* PRODUCT DETAILS */

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .detail-image {
      border-radius: 12px;
      overflow: hidden;
      background: #181818;
    }

    .detail-image img {
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .detail-info h2 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .detail-info p {
      color: #999;
      margin: 15px 0;
    }

    .detail-price {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .size-label {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .size-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
