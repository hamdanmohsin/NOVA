<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA | Premium Fashion</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
    line-height:1.6;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

/* NAVBAR */
nav{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(8,8,8,.95);
    border-bottom:1px solid #222;
    backdrop-filter:blur(10px);
}

.nav-container{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:5px;
}

.nav-links{
    display:flex;
    gap:30px;
    list-style:none;
}

.nav-links a{
    color:#ccc;
    transition:.3s;
}

.nav-links a:hover{
    color:#fff;
}

.menu-btn{
    display:none;
    background:none;
    border:1px solid #444;
    color:#fff;
    font-size:25px;
    padding:5px 12px;
    border-radius:8px;
    cursor:pointer;
}

/* HERO */
.hero{
    min-height:88vh;
    display:flex;
    align-items:center;
    background:
    radial-gradient(circle at 80% 30%,#222 0%,transparent 35%),
    linear-gradient(135deg,#080808,#111);
}

.hero-content{
    max-width:700px;
}

.hero-small{
    color:#aaa;
    letter-spacing:4px;
    font-size:14px;
    margin-bottom:15px;
}

.hero h1{
    font-size:clamp(55px,11vw,110px);
    line-height:.95;
    letter-spacing:8px;
    margin-bottom:25px;
}

.hero p{
    color:#aaa;
    max-width:550px;
    font-size:18px;
    margin-bottom:35px;
}

.btn{
    display:inline-block;
    background:#fff;
    color:#000;
    padding:14px 28px;
    border-radius:6px;
    font-weight:bold;
    border:none;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    background:#ddd;
}

/* SECTIONS */
.section{
    padding:90px 0;
}

.heading{
    margin-bottom:45px;
}

.heading span{
    color:#777;
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
}

.heading h2{
    font-size:42px;
    margin-top:8px;
}

/* CATEGORIES */
.categories{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.category{
    min-height:220px;
    border:1px solid #252525;
    border-radius:12px;
    padding:30px;
    display:flex;
    align-items:flex-end;
    background:linear-gradient(145deg,#151515,#0d0d0d);
    transition:.3s;
}

.category:hover{
    transform:translateY(-5px);
    border-color:#555;
}

.category h3{
    font-size:25px;
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.product{
    background:#111;
    border:1px solid #252525;
    border-radius:12px;
    overflow:hidden;
    transition:.3s;
}

.product:hover{
    transform:translateY(-5px);
    border-color:#444;
}

.product-image{
    height:260px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#202020,#0d0d0d);
    font-size:55px;
}

.product-info{
    padding:22px;
}

.product-info h3{
    font-size:21px;
    margin-bottom:7px;
}

.description{
    color:#888;
    font-size:14px;
    margin-bottom:18px;
}

.product-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.price{
    font-weight:bold;
    font-size:18px;
}

.order-btn{
    background:#fff;
    color:#000;
    border:none;
    padding:11px 15px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.order-btn:hover{
    background:#ccc;
    transform:translateY(-2px);
}

/* PROMO */
.promo{
    margin:30px 0;
    padding:60px 30px;
    text-align:center;
    border:1px solid #292929;
    border-radius:15px;
    background:linear-gradient(135deg,#171717,#0c0c0c);
}

.promo h2{
    font-size:40px;
    margin-bottom:10px;
}

.promo p{
    color:#999;
    margin-bottom:25px;
}

/* ABOUT */
.about{
    max-width:800px;
}

.about p
