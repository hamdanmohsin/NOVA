<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA — Modern Clothing Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .cart-btn {
      background: white;
      color: #111;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      background: #111;
      color: white;
      padding: 80px 7%;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(40px, 8vw, 80px);
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      font-size: 18px;
    }

    .search-area {
      padding: 30px 7%;
      text-align: center;
    }

    #searchInput {
      width: 100%;
      max-width: 600px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .products {
      padding: 20px 7% 70px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
    }

    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 18px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .size-select {
      width: 100%;
      padding: 11px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .order-btn {
      width: 100%;
      padding: 12px;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .order-btn:hover {
      background: #333;
    }

    .empty {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: #777;
    }

    .cart {
      position: fixed;
      top: 0;
      right: -420px;
      width: 390px;
      max-width: 95%;
      height: 100vh;
      background: white;
      z-index: 2000;
      box-shadow: -5px 0 20px rgba(0,0,0,0.2);
      transition: right 0.3s ease;
      padding: 25px;
      overflow-y: auto;
    }

    .cart.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .close-cart {
      border: none;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
    }

    .cart-item h4 {
      margin-bottom: 5px;
    }

    .cart-item p {
      margin-bottom: 8px;
      color: #555;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-controls button {
      width: 30px;
      height: 30px;
      border: none;
      background: #111;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .remove-btn {
      margin-top: 8px;
      background: #ddd;
      color: #111;
      border: none;
      padding: 7px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .cart-total {
      font-size: 22px;
      font-weight: bold;
      margin: 25px 0;
    }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    .checkout {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .checkout.show {
      display: flex;
    }

    .checkout-box {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 15px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .checkout-box h2 {
      margin-bottom: 20px;
    }

    .checkout-box input,
    .checkout-box textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .checkout-box textarea {
      min-height: 100px;
      resize: vertical;
    }

    .checkout-actions {
      display: flex;
      gap: 10px;
    }

    .checkout-actions button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .submit-order {
      background: #111;
      color: white;
    }

    .cancel-order {
      background: #ddd;
      color: #111;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px 5%;
      }

      .hero {
        padding: 60px 5%;
      }

      .products {
        padding-left: 5%;
        padding-right: 5%;
      }

      .cart {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">NOVA</div>

  <button class="cart-btn" id="cartButton">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <h1>NOVA</h1>
  <p>Modern clothing. Simple style.</p>
</section>

<section class="search-area">
  <input
    type="text"
    id="searchInput"
    placeholder="Search clothes..."
  >
</section>

<main>
  <section class="products" id="productsContainer"></section>
</main>

<aside class="cart" id="cart">

  <div class="cart-header">
    <h2>Your Cart</h2>

    <button class="close-cart" id="closeCart">
      ✕
    </button>
  </div>

  <div id="cartItems">
    <p>Your cart is empty.</p>
  </div>

  <div class="cart-total">
    Total: Rs. <span id="cartTotal">0</span>
  </div>

  <button class="checkout-btn" id="checkoutButton">
    Proceed to Checkout
  </button>

</aside>

<div class="checkout" id="checkout">

  <div class="checkout-box">

    <h2>Complete Your Order</h2>

    <input
      type="text"
      id="customerName"
      placeholder="Your name"
    >

    <input
      type="tel"
      id="customerPhone"
      placeholder="Phone number"
    >

    <input
      type="text"
      id="customerCity"
      placeholder="Delivery city"
    >

    <textarea
      id="customerAddress"
      placeholder="Complete delivery address"
    ></textarea>

    <div class="checkout-actions">

      <button
        class="cancel-order"
        id="cancelOrder"
      >
        Cancel
      </button>

      <button
        class="submit-order"
        id="submitOrder"
      >
        Place Order
      </button>

    </div>

  </div>

</div>

<footer>
  <p>© 2026 NOVA. All rights reserved.</p>
</footer>

<script>

  
     
  

  


  /* ============================
     PRODUCTS
  ============================ */

  const products = [
    {
      id: 1,
      name: "Classic Black T-Shirt",
      price: 1499,
      image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80"
    },

    {
      id: 2,
      name: "White Premium T-Shirt",
      price: 1599,
      image: "https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=700&q=80"
    },

    {
      id: 3,
      name: "Denim Jacket",
      price: 3499,
      image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=700&q=80"
    },

    {
      id: 4,
      name: "Black Hoodie",
      price: 2999,
      image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=700&q=80"
    },

    {
      id: 5,
      name: "Casual Shirt",
      price: 2299,
      image: "https://images.unsplash.com/photo-1603252110481-7ba873bf42ab?auto=format&fit=crop&w=700&q=80"
    },

    {
      id: 6,
      name: "Streetwear Jacket",
      price: 3999,
      image: "https://images.unsplash.com/photo-1544966503-7cc5ac882d5f?auto=format&fit=crop&w=700&q=80"
    }
  ];


  /* ============================
     CART
  ============================ */

  let cart = [];


  /* ============================
     DISPLAY PRODUCTS
  ============================ */

  function displayProducts(list) {

    const container =
      document.getElementById("productsContainer");

    container.innerHTML = "";

    if (list.length === 0) {

      container.innerHTML =
        '<div class="empty">No products found.</div>';

      return;
    }

    list.forEach(product => {

      const card =
        document.createElement("article");

      card.className = "product";

      card.innerHTML = `
        <img
          src="${product.image}"
          alt="${product.name}"
        >

        <div class="product-info">

          <h3>${product.name}</h3>

          <div class="price">
            Rs. ${product.price.toLocaleString()}
          </div>

          <select
            class="size-select"
            id="size-${product.id}"
          >
            <option value="">Select Size</option>
            <option value="S">Small</option>
            <option value="M">Medium</option>
            <option value="L">Large</option>
            <option value="XL">XL</option>
          </select>

          <button
            class="order-btn"
            data-id="${product.id}"
          >
            Add to Cart
          </button>

        </div>
      `;

      container.appendChild(card);
    });

    document
      .querySelectorAll(".order-btn")
      .forEach(button => {

        button.addEventListener("click", function() {

          const id =
            Number(this.dataset.id);

          addToCart(id);

        });

      });

  }


  /* ============================
     ADD TO CART
  ============================ */

  function addToCart(productId) {

    const product =
      products.find(p => p.id === productId);

    const sizeElement =
      document.getElementById(
        `size-${productId}`
      );

    if (!sizeElement) {

      alert("Please select a product size.");

      return;
    }

    const size =
      sizeElement.value;

    if (!size) {

      alert("Please select a size first.");

      return;
    }

    const existing =
      cart.find(
        item =>
          item.id === productId &&
          item.size === size
      );

    if (existing) {

      existing.quantity++;

    } else {

      cart.push({
        id: product.id,
        name: product.name,
        price: product.price,
        size: size,
        quantity: 1
      });

    }

    updateCart();

    alert(
      product.name +
      " added to your cart!"
    );

  }


  /* ============================
     UPDATE CART
  ============================ */

  function updateCart() {

    const cartItems =
      document.getElementById("cartItems");

    const cartCount =
      document.getElementById("cartCount");

    const cartTotal =
      document.getElementById("cartTotal");

    cartItems.innerHTML = "";

    let total = 0;
    let count = 0;

    if (cart.length === 0) {

      cartItems.innerHTML =
        "<p>Your cart is empty.</p>";

      cartCount.textContent = "0";
      cartTotal.textContent = "0";

      return;
    }

    cart.forEach((item, index) => {

      total +=
        item.price * item.quantity;

      count += item.quantity;

      const div =
        document.createElement("div");

      div.className = "cart-item";

      div.innerHTML = `
        <h4>${item.name}</h4>

        <p>Size: ${item.size}</p>

        <p>
          Rs. ${item.price.toLocaleString()}
        </p>

        <div class="quantity-controls">

          <button
            class="minus"
            data-index="${index}"
          >
            −
          </button>

          <span>${item.quantity}</span>

          <button
            class="plus"
            data-index="${index}"
          >
            +
          </button>

        </div>

        <button
          class="remove-btn"
          data-index="${index}"
        >
          Remove
        </button>
      `;

      cartItems.appendChild(div);

    });

    cartCount.textContent = count;

    cartTotal.textContent =
      total.toLocaleString();


    document
      .querySelectorAll(".minus")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            changeQuantity(
              Number(button.dataset.index),
              -1
            );

          }
        );

      });


    document
      .querySelectorAll(".plus")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            changeQuantity(
              Number(button.dataset.index),
              1
            );

          }
        );

      });


    document
      .querySelectorAll(".remove-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            removeFromCart(
              Number(button.dataset.index)
            );

          }
        );

      });

  }


  /* ============================
     QUANTITY
  ============================ */

  function changeQuantity(index, amount) {

    if (!cart[index]) return;

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {

      cart.splice(index, 1);

    }

    updateCart();

  }


  /* ============================
     REMOVE
  ============================ */

  function removeFromCart(index) {

    cart.splice(index, 1);

    updateCart();

  }


  /* ============================
     OPEN CART
  ============================ */

  document
    .getElementById("cartButton")
    .addEventListener("click", () => {

      document
        .getElementById("cart")
        .classList.add("open");

    });


  /* ============================
     CLOSE CART
  ============================ */

  document
    .getElementById("closeCart")
    .addEventListener("click", () => {

      document
        .getElementById("cart")
        .classList.remove("open");

    });


  /* ============================
     SEARCH
  ============================ */

  document
    .getElementById("searchInput")
    .addEventListener("input", function() {

      const search =
        this.value.toLowerCase().trim();

      const filtered =
        products.filter(product =>
          product.name
            .toLowerCase()
            .includes(search)
        );

      displayProducts(filtered);

    });


  /* ============================
     CHECKOUT
  ============================ */

  document
    .getElementById("checkoutButton")
    .addEventListener("click", () => {

      if (cart.length === 0) {

        alert("Your cart is empty.");

        return;
      }

      document
        .getElementById("checkout")
        .classList.add("show");

    });


  /* ============================
     CANCEL CHECKOUT
  ============================ */

  document
    .getElementById("cancelOrder")
    .addEventListener("click", () => {

      document
        .getElementById("checkout")
        .classList.remove("show");

    });


  /* ============================
     PLACE ORDER
  ============================ */

  document
    .getElementById("submitOrder")
    .addEventListener("click", () => {

      const name =
        document
          .getElementById("customerName")
          .value.trim();

      const phone =
        document
          .getElementById("customerPhone")
          .value.trim();

      const city =
        document
          .getElementById("customerCity")
          .value.trim();

      const address =
        document
          .getElementById("customerAddress")
          .value.trim();


      if (
        !name ||
        !phone ||
        !city ||
        !address
      ) {

        alert(
          "Please fill in all the fields."
        );

        return;
      }


      let order = "NOVA ORDER\n\n";

      order +=
        "Customer: " + name + "\n";

      order +=
        "Phone: " + phone + "\n";

      order +=
        "City: " + city + "\n";

      order +=
        "Address: " + address + "\n\n";

      order += "PRODUCTS:\n";


      cart.forEach(item => {

        order +=
          item.name +
          " | Size: " +
          item.size +
          " | Qty: " +
          item.quantity +
          " | Rs. " +
          (item.price * item.quantity) +
          "\n";

      });


      const total =
        cart.reduce(
          (sum, item) =>
            sum +
            item.price *
            item.quantity,
          0
        );


      order +=
        "\nTOTAL: Rs. " +
        total;


      alert(
        "Order created successfully!\n\n" +
        order
      );


      cart = [];

      updateCart();

      document
        .getElementById("checkout")
        .classList.remove("show");

      document
        .getElementById("cart")
        .classList.remove("open");

      document
        .getElementById("customerName")
        .value = "";

      document
        .getElementById("customerPhone")
        .value = "";

      document
        .getElementById("customerCity")
        .value = "";

      document
        .getElementById("customerAddress")
        .value = "";

    });


  /* ============================
     START NOVA
  ============================ */

  displayProducts(products);

  updateCart();

</script>

</body>
  </html>
